<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" fill="#050505"/>
  
  <!-- Rotated 45-degree diamond -->
  <g transform="translate(50, 50) rotate(45) translate(-50, -50)">
    <rect x="25" y="25" width="50" height="50" stroke="#a855f7" stroke-width="8" fill="none" />
  </g>
  
  <!-- Text placed in center, unrotated -->
  <text x="50" y="61" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">BA</text>
</svg>
